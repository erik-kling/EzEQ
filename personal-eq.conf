context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "EzEQ"
            media.name = "EzEQ"
            audio.channels = 2
            audio.position = [ FL FR ]
            filter.graph = {
                nodes = [
                    { type = builtin name = band60 label = bq_peaking control = { Freq = 60 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = band150 label = bq_peaking control = { Freq = 150 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = band400 label = bq_peaking control = { Freq = 400 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = band1000 label = bq_peaking control = { Freq = 1000 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = band2400 label = bq_peaking control = { Freq = 2400 Q = 1.0 Gain = 0.0 } }
                    { type = builtin name = band15000 label = bq_peaking control = { Freq = 15000 Q = 1.0 Gain = 0.0 } }
                ]
                links = [
                    { output = "band60:Out" input = "band150:In" }
                    { output = "band150:Out" input = "band400:In" }
                    { output = "band400:Out" input = "band1000:In" }
                    { output = "band1000:Out" input = "band2400:In" }
                    { output = "band2400:Out" input = "band15000:In" }
                ]
            }
            capture.props = {
                node.name = personal_eq_sink
                media.class = Audio/Sink
                node.virtual = true
                priority.session = 100
            }
            playback.props = {
                node.name = personal_eq_playback
                node.description = "EzEQ playback"
                node.passive = true
            }
        }
    }
]
